# ModelSwitch configuration. Copy to modelswitch.toml and adjust.
# This file holds structure only. Secrets live in environment variables;
# the file names which variable to read, never the value.

[server]
bind = "127.0.0.1:8080"

[database]
# Environment variable that holds the PostgreSQL connection URL.
url_env = "DATABASE_URL"
max_connections = 10

[health]
# How long /health/ready waits for the database (100-10000 ms).
database_timeout_ms = 1000

[auth]
# How long each request waits for its API key lookup (100-10000 ms).
# Past this, the request is refused with 503, never let through.
database_timeout_ms = 1000

[accounting]
# How long a response waits for its request record to be written
# (100-10000 ms). Past this, the response is still delivered, marked
# with the header X-ModelSwitch-Accounting: failed.
database_timeout_ms = 1000

[reliability]
# Provider calls per request, across retries and fallback (1-10).
max_attempts = 3
# Total time for a request, across all attempts (1000-300000 ms).
request_timeout_ms = 60000

[rate_limit]
# The limit for each API key (1-100000). Past it, requests get 429 with
# Retry-After. `burst` is how many can arrive at once after a quiet spell.
requests_per_minute = 60
burst = 60

[metrics]
# Internal address for GET /metrics (Prometheus text format). It needs no
# API key, so keep it off the public network. Remove this section to open
# no second port. Must differ from server.bind.
bind = "127.0.0.1:9090"

# Providers by name. `adapter` is the wire format; more adapters arrive
# with their slices. `timeout_ms` bounds one call (1000-300000, default 30000).
[providers.echo]
adapter = "echo"   # built in: returns the input unchanged, no credentials
models = ["echo-1"]

# Groq (free tier) through the OpenAI-compatible adapter. Uncomment and
# set GROQ_API_KEY in .env. Groq retires models often: check current IDs
# in the Groq console. IDs may contain `/`; pin them as
# `groq/openai/gpt-oss-20b` (only the first `/` separates the provider).
# [providers.groq]
# adapter = "openai_compatible"
# base_url = "https://api.groq.com/openai/v1"
# api_key_env = "GROQ_API_KEY"
# models = ["openai/gpt-oss-20b", "openai/gpt-oss-120b"]

# Google Gemini (free tier). Uncomment and set GEMINI_API_KEY in .env.
# Free-tier prompts may be used by Google: send only test data.
# Model names here must be plain IDs (no `models/` prefix). On the free
# tier the newest models can be slow enough to hit timeout_ms.
# [providers.gemini]
# adapter = "gemini"
# base_url = "https://generativelanguage.googleapis.com/v1beta"
# api_key_env = "GEMINI_API_KEY"
# models = ["gemini-3.5-flash", "gemini-3.5-flash-lite"]

# Local Ollama (no key; plain http is allowed only to localhost).
# [providers.ollama]
# adapter = "openai_compatible"
# base_url = "http://localhost:11434/v1"
# models = ["llama3.2"]

# Aliases: ordered `provider/model` candidates. Clients send the alias
# name or a `provider/model` pin as `model`.
[aliases.default]
candidates = ["echo/echo-1"]

[log]
# "pretty" for local development, "json" for CI and production.
# The level comes from the RUST_LOG environment variable (default: info).
format = "pretty"
