[package]
name = "modelswitch"
version = "0.1.0"
edition = "2024"
description = "Multi-provider LLM inference gateway"
license = "Apache-2.0"
repository = "https://github.com/yosephfetene/ModelSwitch"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["catch-panic", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.54.0", features = ["test-util", "macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
