name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs when a branch receives new commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # Matches the local development version (ADR-014).
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only credentials; #[sqlx::test] creates a database per test.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # The dashboard (ADR-036): built with Node, separate from the Rust jobs.
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # What ships (react, react-dom) must be clean. Build and test tools
      # are reported without failing the job, because an advisory there
      # may have no fixed version yet (ADR-037).
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit build and test tools (report only)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: modelswitch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Start the image with the dashboard on and check it over HTTP. No
      # database is needed: the gateway starts without one (ADR-021).
      - name: Smoke-test the image and its dashboard
        run: |
          docker run -d --name modelswitch \
            -e MODELSWITCH_CONFIG=/etc/modelswitch/modelswitch-admin.toml \
            -e MODELSWITCH_ADMIN_TOKEN=ci-only-admin-token-0123456789abcdef \
            -e DATABASE_URL=postgres://ci:ci@127.0.0.1:1/ci \
            -p 127.0.0.1:8080:8080 -p 127.0.0.1:9091:9091 \
            modelswitch:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health/live >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health/live
          curl -fsS -D headers.txt -o index.html http://127.0.0.1:9091/
          grep -q '<div id="root">' index.html
          grep -qi "content-security-policy: default-src 'self'" headers.txt
          asset=$(grep -o '/assets/[^"]*\.js' index.html | head -n1)
          curl -fsS -o /dev/null "http://127.0.0.1:9091${asset}"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9091/admin/api/session)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin/api/session)" = 404
      - name: Container logs
        if: always()
        run: docker logs modelswitch || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks lists a pull request's commits through the GitHub API, which
    # needs pull-request read access on top of the workflow-wide default.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
